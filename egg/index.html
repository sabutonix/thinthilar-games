/* Little Egg — an on-screen pocket-pet gadget. Grey page, blue egg-shaped device, gold for wins. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#1f2937; --muted:#6b7280; --line:#d9dde3;
  --blue:#2563eb; --blue-d:#1d4fc4; --gold:#c9962b; --gold-soft:#fdf3dc; --on-blue:#ffffff;
  --display:"Padauk","Noto Sans Myanmar","Myanmar Text","Pyidaungsu",serif;
  --body:"Noto Sans Myanmar","Pyidaungsu","Myanmar Text","Padauk",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f141b; --surface:#171d26; --ink:#e5e9f0; --muted:#9aa4b2; --line:#2a3240; --gold-soft:#3a3220; color-scheme:dark; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.6}
button{font:inherit;cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:460px;margin:0 auto;padding:12px 14px 32px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:8px}
.brand{flex:1;min-width:0}
.brand h1{font-family:var(--display);font-size:1.7rem;line-height:1.2;margin:0}
.brand small{color:var(--muted);font-size:.82rem;display:block}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;min-width:44px;height:42px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;padding:0 8px}
/* the gadget */
.device{position:relative;background:radial-gradient(circle at 30% 18%,#4f86f7 0%,var(--blue) 45%,var(--blue-d) 100%);border-radius:50% 50% 44% 44% / 40% 40% 30% 30%;padding:56px 26px 30px;box-shadow:inset 0 -8px 0 rgba(0,0,0,.15),0 10px 24px rgba(37,99,235,.25)}
.device::before{content:"";position:absolute;left:50%;top:18px;transform:translateX(-50%);width:84px;height:8px;border-radius:8px;background:rgba(255,255,255,.35)}
.bezel{background:#1b2333;border-radius:18px;padding:10px;box-shadow:inset 0 2px 6px rgba(0,0,0,.5)}
#cv{display:block;width:100%;aspect-ratio:4/3;border-radius:10px;image-rendering:pixelated;image-rendering:crisp-edges;background:#e8eef6;touch-action:manipulation}
.status{margin:12px 2px 0;min-height:3.2em;color:#fff;text-align:center;font-weight:600;font-size:.98rem;line-height:1.5;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.status small{display:block;font-weight:400;opacity:.9;font-size:.82rem}
.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.actions.one{grid-template-columns:1fr}
.actions.two{grid-template-columns:1fr 1fr}
.act{background:#fff;color:var(--blue-d);border:0;border-radius:14px;min-height:56px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:.86rem;line-height:1.3;box-shadow:0 3px 0 rgba(0,0,0,.18)}
.act span{font-size:1.35rem;line-height:1.2}
.act:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.act.gold{background:var(--gold-soft);color:#7a5a12}
.act[disabled]{opacity:.5}
.knobs{display:flex;justify-content:center;gap:18px;margin-top:16px}
.sndbtn{width:40px;height:40px;margin-top:-12px;border-radius:50%;border:0;background:#f5d27a;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2);font-size:1.05rem;line-height:1}
.knobs i{width:16px;height:16px;border-radius:50%;background:#f5d27a;box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
footer{font-size:.78rem;color:var(--muted);text-align:center}
footer a{color:inherit}
/* dialogs */
dialog{border:0;border-radius:18px;padding:0;width:min(420px,calc(100vw - 24px));background:var(--surface);color:var(--ink);box-shadow:0 20px 50px rgba(0,0,0,.3)}
dialog::backdrop{background:rgba(15,20,27,.55)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:12px;max-height:85vh;overflow:auto}
.dlg h2{margin:0;font-family:var(--display);font-size:1.4rem;line-height:1.3}
.dlg p{margin:0}
.muted{color:var(--muted);font-size:.88rem}
.btn{border:0;border-radius:12px;min-height:46px;padding:8px 14px;font-weight:700;background:var(--blue);color:var(--on-blue)}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#fff}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
input[type=text],textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg);color:var(--ink)}
textarea{min-height:84px;font-family:ui-monospace,monospace;font-size:.8rem;word-break:break-all}
.pill{display:inline-block;font-size:.8rem;font-weight:700;border-radius:999px;padding:2px 12px;color:#fff}
.reveal{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.reveal canvas{width:160px;height:160px;image-rendering:pixelated;background:#e8eef6;border-radius:16px}
.meter{display:grid;grid-template-columns:70px 1fr 38px;gap:8px;align-items:center;font-size:.9rem}
.bar{height:12px;border-radius:8px;background:var(--line);overflow:hidden}
.bar b{display:block;height:100%;background:var(--blue);border-radius:8px}
.bar b.low{background:#d9534f}
.dex{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.dex div{border:2px solid var(--line);border-radius:12px;padding:6px 2px;text-align:center;font-size:.7rem;line-height:1.3}
.dex canvas{width:56px;height:56px;image-rendering:pixelated;display:block;margin:0 auto 2px}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slots.extra{grid-template-columns:repeat(3,1fr) 56px}
.slot{position:relative;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;min-height:62px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.78rem;font-weight:600;line-height:1.25;overflow:hidden}
.slot.on{border-color:var(--blue);box-shadow:0 0 0 2px rgba(37,99,235,.25)}
.slot.add{border-style:dashed;background:var(--gold-soft);color:#7a5a12;border-color:var(--gold)}
.slot.lock{border-style:dashed;color:var(--muted)}
.slot .nm{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .dot{position:absolute;top:4px;right:6px;width:18px;height:18px;border-radius:50%;background:#d9534f;color:#fff;font-size:.72rem;line-height:18px}
.help h3{margin:6px 0 0;font-size:1.02rem}
.help p,.help li{font-size:.92rem;line-height:1.65}
.help ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.rtab{display:flex;flex-direction:column;gap:6px}
.rrow{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.rrow .pill{justify-self:start}
.rrow b{font-size:1.05rem;text-align:right}
.rrow small{grid-column:1/-1;color:var(--muted);font-size:.84rem;line-height:1.5}
.past{display:flex;flex-direction:column;gap:4px;font-size:.88rem}
.note{background:#fffbea;color:#3d3420;border-radius:12px;padding:12px 14px;font-size:.98rem;box-shadow:0 2px 6px rgba(0,0,0,.12);transform:rotate(-1deg)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1f2937;color:#fff;padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .25s;z-index:20;max-width:90vw;text-align:center}
#toast.on{opacity:1}
#fx{position:fixed;inset:0;pointer-events:none;z-index:30}
#dev{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
#dev button{font-size:.75rem;border:1px dashed var(--muted);background:transparent;color:var(--muted);border-radius:8px;padding:4px 8px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function migrate(o){                       // v1 (one pet) → v2 (up to 3 pets)

/* ---------- pet life ---------- */
function newEgg(){
  const w=RAR.map(r=>r.w); const lucky=S.streak>=5; if(lucky) w[0]=0;
  let x=Math.random()*w.reduce((a,b)=>a+b,0), r=0; while(r<w.length-1 && x>=w[r]){ x-=w[r]; r++; }
  const pool=SP.filter(s=>s.r===r), sp=pool[Math.floor(Math.random()*pool.length)];
  const n=now(); if(S.tok>0) S.tok--; S.pets.push({sp:sp.id,rar:r,laid:n,hatchAt:n+EGG_MS,hatched:0,lucky}); S.cur=S.pets.length-1; S.eggs=(S.eggs||0)+1; G=null; save();
}
function hatch(p){
  const n=now();
  Object.assign(p,{hatched:n,last:n,lastCare:n,h:70,j:70,c:100,e:100,poop:0,poopT:0,sick:0,badM:0,cs:0,cn:0,awayTotal:0,away:null,scruffy:0,form:null,napUntil:0,name:p.name||''});
  S.dex[p.sp]=(S.dex[p.sp]||0)+1; S.streak= p.rar===0 ? (S.streak||0)+1 : 0; save();
}
const isNight=ts=>{ const h=new Date(ts).getHours(); return h>=22 || h<7; };
const napping=(p,ts)=> p.napUntil && ts<p.napUntil;
const sleeping=(p,ts)=> isNight(ts) || napping(p,ts);
function ageMs(p,n){ return n - p.hatched - (p.awayTotal||0) - (p.away ? n-p.away.since : 0); }
function stage(p,n){ if(!p||!p.hatched) return 0; const d=ageMs(p,n)/DAY; return d<1?1 : d<3?2 : d<7?3 : 4; }
function careAvg(p){ return p.cn ? p.cs/p.cn : 70; }
function step(p,ts){
  if(p.away) return;
  const k=5/60, asleep=sleeping(p,ts), m=asleep?0.35:1;
  p.h=clamp(p.h-5*k*m);
  p.j=clamp(p.j-(p.sick?8:4)*k*m);
  p.e= asleep ? clamp(p.e+25*k) : clamp(p.e-3*k);
  if(!asleep){ p.poopT+=5; if(p.poopT>=240){ p.poopT=0; if(p.poop<3) p.poop++; } }
  p.c=clamp(p.c-(1.5+p.poop*4)*k);
  const bad=p.h<=0 || p.c<=20;
  p.badM= bad ? p.badM+5 : Math.max(0,p.badM-5);
  if(p.badM>=180) p.sick=1;
  p.cs+=(p.h+p.j+p.c)/3; p.cn++;
  if(ts-p.lastCare>48*HOUR) p.away={since:ts,days:[]};
}
let grownQ=[];
function sim(){
  const n=now(); let moved=false;
  S.pets.forEach(p=>{
    if(!p.hatched) return;
    if(n-p.last>60*DAY) p.last=n-60*DAY;           // safety cap
    while(p.last+STEP<=n){ p.last+=STEP; step(p,p.last); moved=true; }
    if(!p.form && !p.away && stage(p,n)===4){
      const c=careAvg(p); p.form= (p.scruffy||c<45) ? 'scruffy' : c>=70 ? 'shiny' : 'normal'; S.tok=(S.tok||0)+1; moved=true; grownQ.push(p);
    }
  });
  if(moved) save();
}
function cared(){ const p=cur(); p.lastCare=now(); }
const dayKey=ts=>{ const d=new Date(ts); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };

function bg(night){

  ctx.fillStyle= night ? '#222b40' : '#d6dfeb'; ctx.fillRect(0,214,320,26);
  ctx.fillStyle= night ? '#3a4766' : '#c3cfdf'; for(let x=0;x<320;x+=16) ctx.fillRect(x+((x/16)%2?8:0),220,8,4);
  if(night){ ctx.fillStyle='#f5e7a8'; ctx.beginPath(); ctx.arc(276,40,16,0,7); ctx.fill(); ctx.fillStyle='#2a3550'; ctx.beginPath(); ctx.arc(268,34,14,0,7); ctx.fill(); }

const CRACKS=[[8,4],[7,5],[8,6],[9,7],[8,8],[6,6],[5,7],[10,5],[11,6],[7,9]];
function drawEgg(p,n){
  bg(false);
  const left=p.hatchAt-n, frac=1-Math.max(0,left)/EGG_MS, pxs=8, size=128;
  let x=96, y=214-size;
  const shaking = hatchAnim || left<=0;
  if(!RM){ if(shaking) x+= (frame%2?6:-6); else if(frame%12<2) x+=(frame%2?4:-4); }
  if(left<15e3 || shaking){ const a= RM?0.35:0.25+0.2*Math.sin(frame/2); ctx.fillStyle=RAR[p.rar].col; ctx.globalAlpha=a; ctx.beginPath(); ctx.arc(160,y+70,92,0,7); ctx.fill(); ctx.globalAlpha=1; }
  A.draw(ctx,'egg',A.EGG_PAL,x,y,pxs);
  const nc=Math.floor(frac*CRACKS.length);
  ctx.fillStyle='#4a3f30'; for(let i=0;i<nc;i++){ const [c,r]=CRACKS[i]; ctx.fillRect(x+c*pxs,y+r*pxs,pxs,pxs); }
  if(hatchAnim){ const k=(performance.now()-hatchAnim)/2200; if(k>0.75){ ctx.fillStyle='rgba(255,255,255,'+Math.min(1,(k-0.75)*4)+')'; ctx.fillRect(0,0,320,240); } }
}
function drawIntro(){
  bg(false);
  const b=4*Math.sin(frame/3)*(RM?0:1);
  A.draw(ctx,'egg',{a:'#cfd6e0',b:'#bcc5d2',c:'#cfd6e0',o:'#9aa4b2'},96,86+b,8);
  ctx.fillStyle='#2b2f36'; ctx.font='bold 44px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('?',160,150+b);
}
function drawAway(p,n){
  bg(isNight(n));
  ctx.fillStyle='#fffbea'; ctx.fillRect(130,150,60,46); ctx.fillStyle='#c9b98a'; for(let i=0;i<4;i++) ctx.fillRect(138,160+i*9,44-(i===3?18:0),3);
  ctx.fillStyle='#e05a5a'; ctx.fillRect(156,146,8,8);
  ctx.fillStyle='#9aa4b2'; for(let i=0;i<5;i++){ ctx.fillRect(210+i*22,200-(i%2)*8,6,6); ctx.fillRect(218+i*22,196-(i%2)*8,4,4); }
  if(p.away.days.includes(dayKey(n))){ ctx.fillStyle='#ffffff'; ctx.fillRect(56,192,44,18); ctx.fillStyle='#2b2f36'; ctx.fillRect(56,206,44,4); emo('🍚',78,186,26); }
}
const DIRT=[[4,9],[11,11],[9,6],[6,13]];
function drawPet(p,n){
  const night=isNight(n), asleep=sleeping(p,n), st=stage(p,n), s=spById(p.sp);
  bg(night);
  const body= st===1 ? 'blob' : s.body, pxs=[0,6,7,9,11][st], size=16*pxs;
  const maxX=160-size/2-8;
  if(G){ px0 = G.phase==='show' ? G.turn*Math.min(90,maxX) : 0; }
  else if(!RM && !asleep && frame%4===0){ if(Math.random()<.3) dir=-dir; px0=Math.max(-maxX,Math.min(maxX,px0+dir*10)); }
  const bob=(!RM && !asleep && frame%2) ? -Math.round(pxs/2) : 0;
  const x=Math.round(160-size/2+px0), y=214-size+bob+(st===1?pxs*2:0);
  A.draw(ctx,body,s.pal,x,y,pxs,{flip:dir<0});
  if(p.form==='scruffy'){ ctx.fillStyle='rgba(90,70,50,.75)'; DIRT.forEach(([c,r])=>ctx.fillRect(x+c*pxs,y+r*pxs,pxs,pxs)); }
  if(p.form==='shiny' && !asleep){ emo('✨',x+size+4,y+10+(frame%4<2?0:4),20); emo('✨',x-6,y+size*0.55,16); }
  for(let i=0;i<p.poop;i++) emo('💩',300-i*28,200,24);
  if(asleep){ ctx.fillStyle='rgba(15,20,40,.45)'; ctx.fillRect(0,0,320,240); emo('💤',x+size,y-6+(frame%6<3?0:-6),26); }
  else if(G){ if(G.phase==='ask') bubble('❓',x+size,y); else bubble(G.ok?'⭕':'❌',x+size,y); }
  else if(p.sick) bubble('🤒',x+size,y);
  else if(p.h<25) bubble('🍚',x+size,y);
  else if(p.c<30 && p.poop) bubble('🫧',x+size,y);
  else if(p.j<25) bubble('💧',x+size,y);
  const tn=performance.now(); fxs=fxs.filter(f=>f.until>tn);
  fxs.forEach(f=>{ const k=1-(f.until-tn)/1500; emo(f.e,x+size/2+f.dx,y-10-k*30,26); });
}
function render(){
  frame++; const p=cur(), n=now();
  if(!p) drawIntro();
  else if(!p.hatched) drawEgg(p,n);
  else if(p.away) drawAway(p,n);
  else drawPet(p,n);
}
function pop(e){ fxs.push({e,dx:(Math.random()*40-20),until:performance.now()+1500}); }

/* ---------- status line + buttons ---------- */
const fmt=ms=>{ const s=Math.max(0,Math.ceil(ms/1000)); return num(Math.floor(s/60))+':'+num(String(s%60).padStart(2,'0')); };
let lastUI='';
function refresh(){ lastUI=''; ui(); }
function ui(){

  else if(p.away){ st=t('awayS',{name:p.name}); sub=t('awayDays',{n:num(p.away.days.length)});

  else if(G){ st= G.phase==='ask' ? t('gameQ',{r:num(G.round)}) : (G.ok?t('hit'):t('miss')); acts=[['◀',t('left'),()=>guess(-1),'',G.phase!=='ask'],['▶',t('right'),()=>guess(1),'',G.phase!=='ask']]; cls='two'; }

    acts=[['🍚',t('feed'),feedMenu],['🎾',t('play'),startGame],['🧼',t('clean'),doClean],
          [napping(p,n)?'☀️':'🌙',napping(p,n)?t('wake'):t('sleep'),doSleep],['💊',t('med'),doMed],['📋',t('info'),showInfo]];
  }

}
function needs(p){ const n=now(); if(!p.hatched) return n>=p.hatchAt; return !!(p.away || p.sick || p.h<25 || (p.poop&&p.c<30) || p.j<25); }
function slotKey(){ const n=now(); return S.cur+'|'+S.tok+'|'+S.pets.map(p=>[p.sp,p.name,p.hatched?stage(p,n):0,needs(p)?1:0].join(',')).join(';'); }
function drawSlots(){
  const box=$('#slots'); box.innerHTML=''; const n=now();

  const extra= S.pets.length>=MAXP && S.tok>0; box.className='slots'+(extra?' extra':'');

function guess(side){
  if(!G||G.phase!=='ask') return;
  G.turn= Math.random()<.5 ? -1 : 1; G.ok= G.turn===side; if(G.ok) G.score++; TTLSound.play(G.ok?'right':'wrong'); G.phase='show'; refresh();

    el.querySelector('span').replaceWith(c);
  });
}

/* ---------- backup code ---------- */
const BK=[76,105,116,116,108,101,69,103,103,33];
function enc(o){ const b=new TextEncoder().encode(JSON.stringify(o)); let bin=''; b.forEach((x,i)=>bin+=String.fromCharCode(x^BK[i%BK.length])); return 'LE1-'+btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function dec(s){ s=s.trim().replace(/^LE1-/,'').replace(/\s+/g,'').replace(/-/g,'+').replace(/_/g,'/'); s+='='.repeat((4-s.length%4)%4);
  const bin=atob(s), b=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) b[i]=bin.charCodeAt(i)^BK[i%BK.length]; return JSON.parse(new TextDecoder().decode(b)); }
function showBackup(){
  const code=enc(S);
  openDlg(`<h2>${esc(t('backup'))}</h2><p class="muted">${esc(t('backupD'))}</p>
   <textarea id="bkOut" readonly>${esc(code)}</textarea><button class="btn" id="bkCopy">${esc(t('copy'))}</button>
   <label class="muted" for="bkIn">${esc(t('restoreL'))}</label><textarea id="bkIn" placeholder="LE1-…"></textarea>
   <div class="btns"><button class="btn sec" id="bkGo">${esc(t('restore'))}</button><button class="btn sec" id="dClose">${esc(t('close'))}</button></div>`);
  $('#bkCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText(code); }catch(e){ const a=$('#bkOut'); a.select(); document.execCommand('copy'); } toast(t('copied')); };
  $('#bkGo').onclick=()=>{
    let o; try{ o=dec($('#bkIn').value); }catch(e){ o=null; }
    if(o && (o.v===1||o.v===2) && typeof o.dex==='object') o=migrate(Object.assign(blank(),o)); else o=null;
    if(!o || o.pets.some(q=>!q||!spById(q.sp))){ toast(t('restoreBad')); return; }
    if(S.pets.length && !confirm(t('restoreQ'))) return;
    S=o; G=null; save(); closeDlg(); refresh(); toast(t('restoreOk'));
  };
}

/* ---------- picture card ---------- */
async function shareCard(p){
  const s=spById(p.sp), r=RAR[p.rar], W=1080, c=document.createElement('canvas'); c.width=c.height=W; const x=c.getContext('2d'); x.imageSmoothingEnabled=false;
  try{ await document.fonts.load('700 64px "Noto Sans Myanmar"','ဥလေး'); }catch(e){}
  x.fillStyle='#f3f4f6'; x.fillRect(0,0,W,W);
  x.fillStyle='#2563eb'; x.beginPath(); x.roundRect(90,70,900,760,90); x.fill();
  x.fillStyle='#1b2333'; x.beginPath(); x.roundRect(140,170,800,600,40); x.fill();
  x.fillStyle='#e8eef6'; x.beginPath(); x.roundRect(160,190,760,560,28); x.fill();
  x.fillStyle='#d6dfeb'; x.fillRect(160,690,760,60);
  const stg=stage(p,now()), body= stg===1?'blob':s.body, px= stg===1?30:28;
  A.draw(x,body,s.pal,540-8*px,700-16*px+(stg===1?px*2:0),px);
  if(p.form==='scruffy'){ x.fillStyle='rgba(90,70,50,.75)'; DIRT.forEach(([c2,r2])=>x.fillRect(540-8*px+c2*px,700-16*px+r2*px,px,px)); }
  x.fillStyle=r.col; x.beginPath(); x.roundRect(390,100,300,56,28); x.fill();
  x.fillStyle='#fff'; x.textAlign='center'; x.textBaseline='middle'; x.font='700 32px "Noto Sans Myanmar",sans-serif'; x.fillText(rarName(p.rar),540,129);
  x.fillStyle='#1f2937'; x.font='700 64px "Noto Sans Myanmar",sans-serif'; x.fillText(p.name,540,900);
  x.fillStyle='#6b7280'; x.font='600 34px "Noto Sans Myanmar",sans-serif'; x.fillText(spName(s)+' · '+T[lang].stages[stg]+(p.form?' · '+T[lang].forms[p.form]:''),540,972);
  x.fillStyle='#c9962b'; x.font='700 30px "Noto Sans Myanmar",sans-serif'; x.fillText('🥚 ဥလေး · game.thinthilar.com/egg',540,1036);
  const blob=await new Promise(res=>c.toBlob(res,'image/png'));
  const text=t('shareText',{rar:rarName(p.rar),sp:spName(s),name:p.name})+' https://game.thinthilar.com/egg/';
  const file= blob && typeof File!=='undefined' ? new File([blob],'little-egg.png',{type:'image/png'}) : null;
  try{ if(file && navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],text}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  if(blob){ const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='little-egg.png'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),4000); }
}

/* ---------- confetti ---------- */
function confetti(level){
  if(RM) return; const c=$('#fx'), x=c.getContext('2d'); c.width=innerWidth; c.height=innerHeight;
  const cols= level>=3 ? ['#c9962b','#f5d27a','#fff3c4','#2563eb'] : ['#2563eb','#c9962b','#8b3fd9','#f5d27a'];
  const ps=Array.from({length:level>=3?160:90},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,vx:Math.random()*2-1,vy:2+Math.random()*3,r:Math.random()*6,c:cols[Math.floor(Math.random()*cols.length)]}));
  const t0=performance.now();
  (function f(){ const k=performance.now()-t0; x.clearRect(0,0,c.width,c.height);
    ps.forEach(q=>{ q.x+=q.vx; q.y+=q.vy; q.r+=.1; x.save(); x.translate(q.x,q.y); x.rotate(q.r); x.fillStyle=q.c; x.fillRect(-4,-3,8,6); x.restore(); });
    if(k<2600) requestAnimationFrame(f); else x.clearRect(0,0,c.width,c.height); })();
}
