<!DOCTYPE html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent}
.ic{width:512px;height:512px;background:#2563eb;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden}
.ic.round{border-radius:112px}
.tile{position:absolute;width:300px;height:300px;border-radius:56px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 18px 0 #1d4ed8}
.tile span{font-family:Padauk;font-weight:700;font-size:250px;color:#1f2937;line-height:1;transform:translateY(-14px)}
.dot{position:absolute;right:92px;top:92px;width:78px;height:78px;border-radius:20px;background:#e3b54f;transform:rotate(12deg)}
</style></head><body><div class="ic CLS"><div class="tile"><span>ပ</span></div><div class="dot"></div></div></body></html>
