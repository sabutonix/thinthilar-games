<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thin Thi Lar Games</title>
<meta name="description" content="အခမဲ့ မြန်မာ ဂိမ်းများ — ပဟေဠိ နှင့် အခြားဂိမ်းများ">
<meta property="og:title" content="Thin Thi Lar Games — အခမဲ့ မြန်မာဂိမ်းများ">
<meta property="og:description" content="နေ့စဉ် မြန်မာ ပဟေဠိ ကစားပြီး မိတ်ဆွေတွေနဲ့ ယှဉ်ကြည့်ပါ">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-title" content="ပဟေဠိ">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Thin Thi Lar Games">
<meta property="og:url" content="https://game.thinthilar.com/">
<meta property="og:image" content="https://game.thinthilar.com/assets/og-games.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Thin Thi Lar Games — အခမဲ့ မြန်မာဂိမ်းများ">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700&family=Padauk:wght@700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a phone-width shelf of game cards; live games first, coming-soon cards quieter. Grey base + blue actions, same as ပဟေဠိ. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#1f2937; --muted:#6b7280; --line:#d9dde3;
  --jade:#2563eb; --gold:#c9962b; --gold-soft:#fdf3dc; --hit:#2f8f5b; --on-jade:#ffffff;
  --display:"Padauk","Noto Sans Myanmar","Myanmar Text","Pyidaungsu",serif;
  --body:"Noto Sans Myanmar","Pyidaungsu","Myanmar Text","Padauk",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b; --surface:#171d26; --ink:#e5e9f0; --muted:#9aa4b2; --line:#2a3240;
    --jade:#6b9cff; --gold:#e3b54f; --gold-soft:#3a3220; --hit:#3aa36a; --on-jade:#0f141b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171d26; --ink:#e5e9f0; --muted:#9aa4b2; --line:#2a3240;
  --jade:#6b9cff; --gold:#e3b54f; --gold-soft:#3a3220; --hit:#3aa36a; --on-jade:#0f141b; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.7}
a:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:center;gap:10px}
.brand{flex:1}
.brand h1{font-family:var(--display);font-size:1.9rem;line-height:1.25;margin:0;color:var(--ink)}
.brand small{color:var(--muted);font-size:.85rem}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;min-width:44px;height:42px;font:inherit;font-weight:600;cursor:pointer}
h2{margin:0;font-size:1rem;color:var(--muted);font-weight:600}
.shelf{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:center;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
a.card:hover{border-color:var(--jade)}
.card.live{border:2px solid var(--jade)}
.art{width:64px;height:64px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:2rem;background:var(--gold-soft)}
.card.live .art.egg{background:var(--gold-soft);font-size:2rem}
.card.live .art{background:var(--jade);color:var(--on-jade);font-family:var(--display);font-size:1.6rem}
.card b{display:block;font-size:1.2rem}
.card small{display:block;color:var(--muted);font-size:.86rem;line-height:1.5}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:.75rem;font-weight:600;border-radius:999px;padding:2px 10px;border:1px solid var(--line);color:var(--muted)}
.pill.ok{background:var(--hit);border-color:var(--hit);color:#fff}
.pill.go{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
.card.soon{opacity:.75}
footer{font-size:.78rem;color:var(--muted);text-align:center}
footer a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><h1 id="h1"></h1><small id="tag"></small></div>
    <button class="iconbtn" id="acct" aria-label="Account">👤</button>
    <button class="iconbtn" id="lang" aria-label="Language">EN</button>
  </header>
  <h2 id="hLive"></h2>
  <section class="shelf">
    <a class="card live" href="pahaeli/">
      <span class="art">ပ</span>
      <span><b>ပဟေဠိ</b><small id="pDesc"></small><span class="row" id="pStatus"></span></span>
    </a>
    <a class="card live" href="egg/">
      <span class="art egg">🥚</span>
      <span><b id="eT"></b><small id="eDesc"></small><span class="row" id="eStatus"></span></span>
    </a>
  </section>
  <h2 id="hSoon"></h2>
  <section class="shelf">
    <div class="card soon"><span class="art">🌾</span><span><b id="farmT"></b><small id="farmD"></small><span class="row"><span class="pill" id="s1"></span></span></span></div>
    <div class="card soon"><span class="art">🚗</span><span><b id="carT"></b><small id="carD"></small><span class="row"><span class="pill" id="s2"></span></span></span></div>
  </section>
  <footer><span id="foot"></span> · <a href="https://thinthilar.com">thinthilar.com</a> · <a href="privacy/">Privacy</a></footer>
</div>
<script src="/shared/account.js?v=202611140831"></script>
<script>
const EPOCH = Date.UTC(2026,10,7,17,30); // must match pahaeli/
const todayIdx = Math.max(0, Math.floor((Date.now()-EPOCH)/864e5));
const MYD='၀၁၂၃၄၅၆၇၈၉';
const T={
 my:{h1:"ဂိမ်းများ",tag:"အခမဲ့ မြန်မာဂိမ်းများ — ဖုန်းနဲ့ ချက်ချင်းကစားလို့ရ",live:"ယခု ကစားနိုင်သည်",soon:"မကြာမီ လာမည်",
  pDesc:"နေ့စဉ် ပဟေဠိ ၃ မျိုး — စကားလုံး၊ စကားပုံ၊ အုပ်စုခွဲ",done:"ယနေ့ {n}/၃ ပြီး",none:"ယနေ့ ပဟေဠိ အသစ်",all:"ယနေ့ အားလုံးပြီး ✓",
  streak:"🔥 {n} ရက်ဆက်",farmT:"လယ်ယာ",farmD:"ကိုယ်ပိုင်လယ်ယာ စိုက်ပျိုးပြီး မိတ်ဆွေတွေရဲ့ လယ်ယာကို လည်ပတ်ပါ",carT:"ကားမောင်း",carD:"ရန်ကုန်လမ်းတွေပေါ် ကားမောင်းပြီး မိတ်ဆွေတွေရဲ့ အမှတ်ကို ကျော်ပါ",
  soonPill:"မကြာမီ",foot:"အခမဲ့ ကစားနိုင်ပါသည်",
  eT:"ဥလေး",eDesc:"ဥလေးတစ်လုံး မွေးပြီး ကြီးပြင်းအောင် ပြုစုပါ — ရှားပါး တိရစ္ဆာန်တွေ စုဆောင်းပါ",eNew:"အသစ် ✨",eEgg:"🥚 ဥ ပေါက်ခါနီး",eAway:"😢 ထွက်သွားပြီ"},
 en:{h1:"Games",tag:"Free Myanmar games — play right away on your phone",live:"Play now",soon:"Coming soon",
  pDesc:"3 daily Burmese puzzles — Word, Proverb, Groups",done:"{n}/3 done today",none:"New puzzles today",all:"All done today ✓",
  streak:"🔥 {n}-day streak",farmT:"Farm",farmD:"Grow your own farm and visit your friends' farms",carT:"Car",carD:"Drive the streets of Yangon and beat your friends' scores",
  soonPill:"Coming soon",foot:"Free to play",
  eT:"Little Egg",eDesc:"Hatch a mystery egg and raise your pocket pet — collect rare animals",eNew:"New ✨",eEgg:"🥚 About to hatch",eAway:"😢 Ran away"}
};
let lang='my', ps={games:{},stats:{}}, eg=null;
try{ const e=localStorage.getItem('littleegg.v1'); if(e) eg=JSON.parse(e); }catch(e){}
try{ lang=localStorage.getItem('tg.lang')||'my'; const r=localStorage.getItem('pahaeli.v1'); if(r) ps=Object.assign(ps,JSON.parse(r)); }catch(e){}
const num=n=> lang==='my'? String(n).replace(/\d/g,d=>MYD[d]) : String(n);
function render(){
  const t=T[lang]; document.documentElement.lang=lang==='my'?'my':'en';
  for(const k of ['h1','tag','pDesc','eT','eDesc','farmT','farmD','carT','carD','foot']) document.getElementById(k).textContent=t[k];
  document.getElementById('hLive').textContent=t.live; document.getElementById('hSoon').textContent=t.soon;
  document.getElementById('s1').textContent=t.soonPill; document.getElementById('s2').textContent=t.soonPill;
  document.getElementById('lang').textContent= lang==='my'?'EN':'မြန်';
  const done=['A','B','C'].filter(m=>(ps.games[m+'-'+todayIdx]||{}).done).length;
  const best=Math.max(0,...['A','B','C'].map(m=>{ const s=(ps.stats||{})[m]; return s && s.last>=todayIdx-1 ? s.streak : 0; }));
  let h = done===3 ? `<span class="pill ok">${t.all}</span>` : done ? `<span class="pill go">${t.done.replace('{n}',num(done))}</span>` : `<span class="pill go">${t.none}</span>`;
  if(best>1) h+=`<span class="pill">${t.streak.replace('{n}',num(best))}</span>`;
  document.getElementById('pStatus').innerHTML=h;
  const pets= eg ? (eg.pets || (eg.pet?[eg.pet]:[])) : [], es=document.getElementById('eStatus');
  if(!pets.length) es.innerHTML=`<span class="pill go">${t.eNew}</span>`;
  else { es.innerHTML=''; pets.forEach(ep=>{ const sp=document.createElement('span'); sp.className='pill go'; sp.textContent= !ep.hatched ? t.eEgg : ep.away ? (ep.name+' · '+t.eAway) : ('🐾 '+ep.name); es.appendChild(sp); }); }
}
document.getElementById('lang').onclick=()=>{ lang= lang==='my'?'en':'my'; try{localStorage.setItem('tg.lang',lang);}catch(e){} render(); };
render();
TTLAccount.mount('#acct',['egg','pahaeli']);
</script>
</body>
</html>
