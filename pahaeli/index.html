<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="utf-8">

<meta property="og:description" content="စကားလုံး ခန့်မှန်း၊ စကားပုံ စီ၊ အုပ်စုခွဲ — နေ့တိုင်း ပဟေဠိအသစ်">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">

<meta property="og:site_name" content="Thin Thi Lar Games">

<style>
/* Layout idea: one phone-width column — header, mode tabs, the puzzle, a share card. Calm grey base, blue for anything tappable, gold for wins. */
:root{
  --bg:#f3f4f6; --surface:#ffffff; --ink:#1f2937; --muted:#6b7280; --line:#d9dde3;
  --jade:#2563eb; --gold:#c9962b; --gold-soft:#fdf3dc;
  --hit:#2f8f5b; --near:#d4a017; --miss:#8a9893;
  --g1:#e9c46a; --g2:#7cc08a; --g3:#79a7d8; --g4:#b28fd0;
  --tile:#f9fafb; --tile-ink:#14302a; --g-ink:#1a1a1a; --on-jade:#ffffff;
  --display:"Padauk","Noto Sans Myanmar","Myanmar Text","Pyidaungsu",serif;
  --body:"Noto Sans Myanmar","Pyidaungsu","Myanmar Text","Padauk",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141b; --surface:#171d26; --ink:#e5e9f0; --muted:#9aa4b2; --line:#2a3240;
    --jade:#6b9cff; --gold:#e3b54f; --gold-soft:#3a3220;
    --hit:#3aa36a; --near:#c99a19; --miss:#4d5e58;
    --g1:#c9a543; --g2:#4f9c5f; --g3:#4b7fb5; --g4:#8c69ad;
    --tile:#1d2430; --tile-ink:#e6efe9; --g-ink:#ffffff; --on-jade:#0f141b; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141b; --surface:#171d26; --ink:#e5e9f0; --muted:#9aa4b2; --line:#2a3240;
  --jade:#6b9cff; --gold:#e3b54f; --gold-soft:#3a3220;
  --hit:#3aa36a; --near:#c99a19; --miss:#4d5e58;
  --g1:#c9a543; --g2:#4f9c5f; --g3:#4b7fb5; --g4:#8c69ad;
  --tile:#1d2430; --tile-ink:#e6efe9; --g-ink:#ffffff; --on-jade:#0f141b; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.7}
body{min-height:100%;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:12px 16px 40px;display:flex;flex-direction:column;gap:14px}
header{display:flex;align-items:center;gap:10px}
.brand{display:flex;flex-direction:column;flex:1;min-width:0}
.home{color:var(--muted);text-decoration:none;font-size:.85rem;align-self:flex-start}
.brand h1 a{color:inherit;text-decoration:none}
.brand h1{font-family:var(--display);font-size:2rem;line-height:1.2;margin:0;color:var(--ink);letter-spacing:.01em}
.brand small{color:var(--muted);font-size:.82rem}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-width:42px;height:42px;padding:0 10px;font-size:.9rem;font-weight:600}
.tabs[hidden],.meta[hidden]{display:none}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:5px}
.tab{border:0;background:transparent;border-radius:10px;padding:8px 4px;font-weight:600;font-size:.95rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;line-height:1.4}
.tab .st{font-size:.72rem;font-weight:400}
.tab[aria-selected="true"]{background:var(--jade);color:var(--on-jade)}
.tab[aria-selected="true"] .st{color:var(--on-jade);opacity:.85}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.85rem;color:var(--muted)}
.meta select{font:inherit;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:2px 6px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.howto{margin:0;font-size:.92rem;color:var(--muted)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
/* Word mode */
.board{display:grid;gap:6px;justify-content:center}
.row{display:grid;grid-template-columns:repeat(2,112px);gap:6px}
.cell{height:52px;border:2px solid var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.35rem;font-weight:600;background:var(--tile);color:var(--tile-ink);transition:transform .25s}
.cell.filled{border-color:var(--muted)}
.cell.hint{color:var(--gold);border-style:dashed;border-color:var(--gold)}
.cell.hit,.key.hit{background:var(--hit);border-color:var(--hit);color:#fff}
.cell.near,.key.near{background:var(--near);border-color:var(--near);color:#1d1600}
.cell.miss,.key.miss{background:var(--miss);border-color:var(--miss);color:#fff}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.key{border:1px solid var(--line);background:var(--tile);color:var(--tile-ink);border-radius:10px;min-height:50px;font-size:1.15rem;font-weight:600;padding:4px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:600;padding:6px 12px}
.btn.primary{background:var(--jade);border-color:var(--jade);color:var(--on-jade)}
.btn.gold{background:var(--gold-soft);border-color:var(--gold);color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
/* Proverb mode */
.slots{display:flex;flex-wrap:wrap;gap:6px;min-height:56px;padding:10px;border:2px dashed var(--line);border-radius:12px;background:var(--bg)}
.piece{border:1px solid var(--line);background:var(--tile);color:var(--tile-ink);border-radius:10px;padding:6px 12px;font-size:1.15rem;font-weight:600;min-height:44px}
.piece.lock{background:var(--hit);border-color:var(--hit);color:#fff;cursor:default}
.piece.empty{border-style:dashed;color:var(--muted);min-width:56px;background:transparent}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.tries{display:flex;flex-direction:column;gap:2px;font-size:1rem;letter-spacing:2px}
.proverb-done{font-family:var(--display);font-size:1.5rem;color:var(--jade);text-wrap:balance;margin:0}
/* Groups mode */
.grid16{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.word{min-height:62px;border-radius:10px;border:1px solid var(--line);background:var(--tile);color:var(--tile-ink);font-weight:600;font-size:.92rem;padding:4px;line-height:1.35}
.word.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.solved{border-radius:10px;padding:8px 10px;text-align:center;color:var(--g-ink);grid-column:1/-1}
.solved b{display:block;font-size:.95rem}
.solved span{font-size:.85rem}
.d1{background:var(--g1)}.d2{background:var(--g2)}.d3{background:var(--g3)}.d4{background:var(--g4)}
.dots{display:flex;gap:6px;align-items:center;font-size:.85rem;color:var(--muted)}
.dots i{width:12px;height:12px;border-radius:50%;background:var(--jade);display:inline-block}
.dots i.off{background:var(--line)}
/* Result */
.result[hidden]{display:none}
.result{border:2px solid var(--gold);background:var(--gold-soft);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.result h2{margin:0;font-family:var(--display);font-size:1.4rem}
.sharebox{white-space:pre-wrap;font-family:var(--body);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:.9rem;margin:0;width:100%;resize:none;color:var(--ink)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.links a{flex:1;text-align:center;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px;font-weight:600;font-size:.9rem}
.next{font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;top:18px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-weight:600;font-size:.92rem;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90vw;text-align:center}
.toast.on{opacity:1}
.shake{animation:shake .35s}
.cell.flip{animation:flip .5s ease both}
@keyframes flip{0%{transform:rotateX(-90deg)}100%{transform:rotateX(0)}}
.pop{animation:pop .35s ease both}
@keyframes pop{0%{transform:scale(.85)}60%{transform:scale(1.08)}100%{transform:scale(1)}}
.key,.piece,.word,.btn,.card{transition:transform .08s}
.key:active,.piece:active,.word:active,.btn:active,.card:active{transform:scale(.95)}
.fx{position:fixed;inset:0;pointer-events:none;z-index:30}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.modal.on{display:flex}
.sheet{background:var(--surface);color:var(--ink);border-radius:16px;max-width:460px;width:100%;max-height:85vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.sheet h2{margin:0;font-family:var(--display);font-size:1.4rem;color:var(--jade)}
.sheet h3{margin:6px 0 0;font-size:1rem}
.sheet p{margin:0;font-size:.92rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stats b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums}
.stats span{font-size:.72rem;color:var(--muted)}
.menu{display:flex;flex-direction:column;gap:10px}
.card{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--tile);border-radius:14px;padding:14px;min-height:84px}
.card:hover{border-color:var(--jade)}
.card .ic{font-size:1.9rem;text-align:center}
.card b{display:block;font-size:1.15rem;color:var(--ink)}
.card small{display:block;color:var(--muted);font-size:.84rem;line-height:1.5}
.pill{font-size:.75rem;font-weight:600;border-radius:999px;padding:3px 10px;white-space:nowrap;background:var(--gold-soft);color:var(--ink);border:1px solid var(--gold)}
.pill.ok{background:var(--hit);border-color:var(--hit);color:#fff}
.menu h2{margin:0;font-family:var(--display);font-size:1.3rem}
.banner{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.banner b{font-size:.98rem}.banner span{font-size:.88rem;color:var(--muted)}
.banner.chal{border-color:var(--jade)}
.vs{margin:0;font-weight:600;font-size:1.05rem}.vs small{font-weight:400;color:var(--muted);font-size:.85rem}
.chalbox{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
.chalbox input,.form input{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-height:46px;flex:1;min-width:0}
.form{display:flex;flex-direction:column;gap:6px}.form label{font-size:.88rem;font-weight:600}
.err{color:#b42318;font-size:.88rem;margin:0;min-height:1em}
.card.gift{border-style:dashed}
.daystats{margin:0;font-size:.9rem;color:var(--muted)}.daystats b{color:var(--ink)}
.form.box{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--tile)}.form h3{margin:0;font-size:1rem}
.grp{border:2px solid var(--jade);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface);margin-bottom:10px}
.grphead{display:flex;gap:10px;align-items:center;justify-content:space-between}.grphead span{display:flex;flex-direction:column}.grphead small{color:var(--muted);font-size:.78rem}
.btn.sm{flex:0 0 auto;min-height:38px;font-size:.88rem}
.board2 table{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
.board2 th{font-size:.75rem;color:var(--muted);text-align:left;font-weight:600;padding:4px}.board2 td{padding:6px 4px;border-top:1px solid var(--line)}
.board2 tr.me td{font-weight:700;color:var(--jade)}
.linkbtn{background:none;border:0;color:var(--muted);font-size:.8rem;align-self:flex-end;text-decoration:underline;padding:4px}
footer{font-size:.75rem;color:var(--muted);text-align:center}
@media (max-width:380px){.row{grid-template-columns:repeat(2,100px)}.word{font-size:.82rem}}
</style>
</head>
<body>
<div class="wrap">
  <a class="home" id="homeLink" href="../">← <span id="homeTxt"></span></a>
  <header>
    <div class="brand"><h1><a href="#" id="titleLink">ပဟေဠိ</a></h1><small id="tagline"></small></div>
    <button class="iconbtn" id="btnLang" aria-label="Language">EN</button>
    <button class="iconbtn" id="btnStats" aria-label="Stats">📊</button>
    <button class="iconbtn" id="btnHelp" aria-label="Help">?</button>
    <button class="iconbtn" id="btnAcct" aria-label="Account">👤</button>
    <button class="iconbtn" id="btnSnd" aria-label="Sound">🔊</button>
  </header>
  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-A" data-m="A"><span class="nm"></span><span class="st"></span></button>
    <button class="tab" role="tab" id="tab-B" data-m="B"><span class="nm"></span><span class="st"></span></button>
    <button class="tab" role="tab" id="tab-C" data-m="C"><span class="nm"></span><span class="st"></span></button>
  </nav>
  <div class="meta"><span id="pnum"></span><label><span id="archLbl"></span> <select id="arch"></select></label></div>
  <main id="game" class="panel" aria-live="polite"></main>
  <section id="result" class="result" hidden></section>
  <footer id="foot"></footer>
</div>

function rng(seed){ let a = seed>>>0; return ()=>{ a|=0; a=a+0x6D2B79F5|0; let x=Math.imul(a^a>>>15,1|a); x=x+Math.imul(x^x>>>7,61|x)^x; return ((x^x>>>14)>>>0)/4294967296; }; }
function shuffled(arr, seed){ const r=rng(seed), a=arr.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }

const KEY=[112,97,104,101,108,105];
function enc(o){ const b=new TextEncoder().encode(JSON.stringify(o)); let bin=''; b.forEach((x,i)=>bin+=String.fromCharCode(x^KEY[i%KEY.length])); return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,''); }
function dec(str){ try{ const bin=atob(str.replace(/-/g,'+').replace(/_/g,'/')); const b=Uint8Array.from(bin,(c,i)=>c.charCodeAt(0)^KEY[i%KEY.length]); return JSON.parse(new TextDecoder().decode(b)); }catch(e){ return null; } }
function hashStr(x){ let h=2166136261; for(const ch of x){ h^=ch.codePointAt(0); h=Math.imul(h,16777619); } return (h>>>0).toString(36); }
function syl(w){ const out=[]; const a=Array.from(w.normalize('NFC').replace(/[\s​]/g,''));
  for(let i=0;i<a.length;i++){ const c=a[i], cp=c.codePointAt(0);
    const isCons=cp>=0x1000&&cp<=0x1021, isInd=(cp>=0x1023&&cp<=0x102A)||cp===0x103F||(cp>=0x104C&&cp<=0x104F);
    let nx=a[i+1]; if(nx==='့') nx=a[i+2];
    const brk = i===0 || isInd || (isCons && a[i-1]!=='္' && nx!=='်' && nx!=='္');
    if(brk) out.push(c); else out[out.length-1]+=c; }
  return out; }

  document.querySelector('.tabs').hidden = solo; $('#homeTxt').textContent=t('home');
  document.querySelector('.meta').hidden = mode==='U'||mode==='MAKE'||mode==='F';
  document.documentElement.lang = S.lang==='my'?'my':'en';
  $('#tagline').textContent=t('tag'); $('#btnLang').textContent = S.lang==='my'?'EN':'မြန်';
  for(const m of ['A','B','C']){
    const b=$('#tab-'+m); b.setAttribute('aria-selected', m===mode); b.querySelector('.nm').textContent=t(m);
    const g=S.games[key(m,day)]; b.querySelector('.st').textContent = g&&g.done ? t('done') : t('todo');
  }
  $('#pnum').textContent = `${t('num')} #${num(day+1)}` + (day!==todayIdx ? ` · ${t('archNote')}`:'');
  $('#archLbl').textContent = t('arch');
  const sel=$('#arch'); sel.innerHTML='';
  for(let d=todayIdx; d>=0 && d>todayIdx-60; d--){ const o=document.createElement('option'); o.value=d; o.textContent = d===todayIdx? `${t('today')} (#${num(d+1)})` : '#'+num(d+1); if(d===day) o.selected=true; sel.appendChild(o); }

}
$('#arch').onchange=e=>{ day=+e.target.value; render(); };
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(b.dataset.m));
function go(m){ if(m==='U'||m==='MAKE'||m==='F'){ if(location.hash==='#'+HASH[m]){ mode=m; render(); } else location.hash=HASH[m]; return; } if(m==='MENU'){ try{history.pushState(null,'',location.pathname);}catch(e){} mode='MENU'; render(); } else location.hash=HASH[m]; }

$('#btnHelp').onclick=()=>openModal(`<h2>${t('help')}</h2>
 <h3>🔤 ${t('A')}</h3><p>${t('aHow')}</p>
 <div class="legend"><span><i style="background:var(--hit)"></i>${t('hit')}</span><span><i style="background:var(--near)"></i>${t('near')}</span><span><i style="background:var(--miss)"></i>${t('miss')}</span></div>
 <h3>📜 ${t('B')}</h3><p>${t('bHow')}</p><h3>🧩 ${t('C')}</h3><p>${t('cHow')}</p><p class="next">${t('foot')}</p>`);
$('#btnStats').onclick=()=>{
  let h=`<h2>${t('stats')}</h2>`;

function finish(m, won){
  const g=G(m); g.done=true; if(m!=='B') g.won=won; if(won) FX.win=true; else setTimeout(()=>TTLSound.play('lose'), m==='A'||m==='U'?1250:300);
  if(m!=='U' && day===todayIdx && !g.counted){
    g.counted=true; const s=S.stats[m]||(S.stats[m]={played:0,won:0,streak:0,max:0,last:-9});
    s.played++; if(won){ s.won++; s.streak = (s.last===day-1)? s.streak+1 : 1; s.max=Math.max(s.max,s.streak); s.last=day; } else { s.streak=0; s.last=day; }
  }
  save();
  if(m!=='U' && day===todayIdx && !g.sent && SB_ON){ g.sending=rpc('submit_result',{p_player:pid(),p_day:day,p_mode:m,p_score:scoreOf(m,g),p_won: m==='B'?true:!!won}).then(()=>{ g.sent=true; save(); }).catch(()=>{}); }
}

// ---------- WORD (A) ----------
function scoreRow(guess, ans){
  const res=guess.map((x,i)=> x===ans[i]?'hit':null); const rest=ans.filter((x,i)=>res[i]!=='hit');
  return res.map((r,i)=>{ if(r) return r; const k=rest.indexOf(guess[i]); if(k>=0){rest.splice(k,1); return 'near';} return 'miss'; });
}
function syl2(w,bank){ for(const a of bank) if(w.startsWith(a) && bank.includes(w.slice(a.length))) return [a,w.slice(a.length)]; return null; }
function giftPuzzle(){
  if(CUP._p) return CUP._p;
  const pool=[...new Set(P.A.flatMap(x=>x.b))].filter(x=>!CUP.w.includes(x));
  const seed=parseInt(CUP.id,36)||1; const extra=shuffled(pool,seed).slice(0,10);
  CUP._p={a:CUP.w.join(''), s:CUP.w, b:shuffled([...CUP.w,...extra],seed+7), v:null};
  return CUP._p; }
function renderA(){
  const M = mode==='U' ? 'U' : 'A';
  const p = M==='U' ? giftPuzzle() : pz('A',day), g=G(M); const ans=p.s; const el=$('#game');
  const best={}; g.guesses.forEach(gs=>scoreRow(gs,ans).forEach((r,i)=>{ const x=gs[i]; const rank={hit:3,near:2,miss:1}; if(!best[x]||rank[r]>rank[best[x]]) best[x]=r; }));
  let rows='';
  for(let r=0;r<6;r++){
    let cells='';
    if(r<g.guesses.length){ const sc=scoreRow(g.guesses[r],ans); const fl=FX.row===r; g.guesses[r].forEach((x,i)=>cells+=`<div class="cell ${sc[i]}${fl?' flip':''}"${fl?` style="animation-delay:${i*220}ms"`:''}>${x}</div>`); }
    else if(r===g.guesses.length && !g.done){ for(let i=0;i<2;i++){ const x=g.cur[i]; cells+= x?`<div class="cell filled">${x}</div>` : (g.hint&&i===0?`<div class="cell hint">${ans[0]}</div>`:`<div class="cell"></div>`);} }
    else cells='<div class="cell"></div><div class="cell"></div>';
    rows+=`<div class="row">${cells}</div>`;
  }
  el.innerHTML=`${M==='U'?`<div class="banner"><b>${esc(tf('giftHead',{n:CUP.n}))}</b>${CUP.h?`<span>${esc(tf('giftHint',{h:CUP.h}))}</span>`:''}</div>`:chalBanner('A')}<p class="howto">${t('aHow')}</p>
   <div class="legend"><span><i style="background:var(--hit)"></i>${t('hit')}</span><span><i style="background:var(--near)"></i>${t('near')}</span><span><i style="background:var(--miss)"></i>${t('miss')}</span></div>
   <div class="board" id="board">${rows}</div>
   ${g.done?'':`<div class="keys">${p.b.map(x=>`<button class="key ${best[x]||''}" data-s="${x}">${x}</button>`).join('')}</div>
   <div class="actions"><button class="btn" id="aDel">${t('del')}</button><button class="btn gold" id="aHint" ${g.hint?'disabled':''}>${t('hint')}</button><button class="btn primary" id="aGo">${t('guess')}</button></div>`}`;
  if(g.done) return renderResult();
  el.querySelectorAll('.key').forEach(k=>k.onclick=()=>{ if(g.cur.length<2){ g.cur.push(k.dataset.s); save(); renderA(); } });
  $('#aDel').onclick=()=>{ g.cur.pop(); save(); renderA(); };
  $('#aHint').onclick=()=>{ g.hint=true; save(); renderA(); toast(`💡 ${ans[0]} …`); };
  $('#aGo').onclick=()=>{
    if(g.cur.length<2){ toast(t('need2')); return shake(); }
    const w=g.cur.join(''); if(p.v && !p.v.includes(w)){ toast(t('notword')); return shake(); }
    g.guesses.push(g.cur.slice()); g.cur=[]; FX.row=g.guesses.length-1;
    const won = w===p.a; if(won||g.guesses.length>=6) finish(M,won); else save();
    render();
  };
}
function shake(){ TTLSound.play('nope'); const b=$('#board .row:nth-child('+(G().guesses.length+1)+')'); if(b){ b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); } }

// ---------- PROVERB (B) ----------
function renderB(){
  const p=pz('B',day), g=G('B'), n=p.t.length, el=$('#game');
  if(!g.order){ let o=shuffled([...Array(n).keys()], 7919*(day+1)); if(o.every((x,i)=>x===i)) o.reverse(); g.order=o; }
  if(g.done){
    el.innerHTML=`<p class="proverb-done">${p.p}</p><p class="howto">${t('discuss')}</p>`;
    return renderResult();
  }
  const used=new Set(g.slots.filter(x=>x!=null));
  let slots=''; for(let i=0;i<n;i++){ const ti=g.slots[i];
    slots+= ti==null ? `<button class="piece empty" data-i="${i}" aria-label="empty">${num(i+1)}</button>` : `<button class="piece ${g.locked[i]?'lock':''}${FX.locks.includes(i)?' pop':''}" data-i="${i}"${FX.locks.includes(i)?` style="animation-delay:${FX.locks.indexOf(i)*90}ms"`:''}>${p.t[ti]}</button>`; }
  el.innerHTML=`${chalBanner('B')}<p class="howto">${t('bHow')}</p>
   <div class="slots" id="slots">${slots}</div>
   <div class="bank">${g.order.filter(ti=>!used.has(ti)).map(ti=>`<button class="piece" data-t="${ti}">${p.t[ti]}</button>`).join('')}</div>
   ${g.rows.length?`<div class="tries">${g.rows.map(r=>r).join('<br>')}</div>`:''}
   <div class="actions"><button class="btn gold" id="bHint">${t('hint')}</button><button class="btn primary" id="bGo" ${g.slots.filter(x=>x!=null).length<n?'disabled':''}>${t('check')}</button></div>`;
  el.querySelectorAll('.bank .piece').forEach(b=>b.onclick=()=>{ const i=[...Array(n).keys()].find(i=>g.slots[i]==null); if(i!=null){ g.slots[i]=+b.dataset.t; save(); renderB(); } });
  el.querySelectorAll('#slots .piece').forEach(b=>b.onclick=()=>{ const i=+b.dataset.i; if(g.slots[i]!=null && !g.locked[i]){ g.slots[i]=null; save(); renderB(); } });
  $('#bHint').onclick=()=>{ const i=[...Array(n).keys()].find(i=>!g.locked[i]); if(i==null) return;
    const other=g.slots.indexOf(i); if(other>=0) g.slots[other]=null; g.slots[i]=i; g.locked[i]=true; g.hints++; save(); renderB(); };
  $('#bGo').onclick=()=>{
    const row=[]; FX.locks=[]; for(let i=0;i<n;i++){ const ok=g.slots[i]===i; row.push(ok?'🟩':'⬜'); if(ok&&!g.locked[i]) FX.locks.push(i); if(ok) g.locked[i]=true; else g.slots[i]=null; }
    if(!FX.locks.length) TTLSound.play('nope');
    g.rows.push(row.join('')); if(g.locked.filter(Boolean).length===n && [...Array(n).keys()].every(i=>g.locked[i])) finish('B',true); else save();
    render();
  };
}

// ---------- GROUPS (C) ----------
function renderC(){
  const raw=pz('C',day), g=G('C'), el=$('#game');
  const groups=raw.map(([gi,...wi])=>{ const G0=P.G[gi]; return {d:G0.d,my:G0.my,en:G0.en,w:wi.map(i=>G0.w[i])}; });
  const all=groups.flatMap(x=>x.w);
  if(!g.order) g.order=shuffled(all, 104729*(day+1));
  const foundSet=new Set(g.found.flatMap(i=>groups[i].w));
  const label=x=> S.lang==='my'? x.my : x.en;
  const disp=w=>w.split('|').join('\u200b');
  let html=`${g.done?'':chalBanner('C')}<p class="howto">${t('cHow')}</p><div class="grid16">`;
  const showGroups = g.done ? [...g.found, ...groups.map((_,i)=>i).filter(i=>!g.found.includes(i))] : g.found;
  for(const i of showGroups){ const x=groups[i]; html+=`<div class="solved d${x.d}${FX.group===i?' pop':''}"><b>${label(x)}</b><span>${x.w.map(disp).join('၊ ')}</span></div>`; }
  if(!g.done) for(const w of g.order.filter(w=>!foundSet.has(w))) html+=`<button class="word ${g.sel.includes(w)?'sel':''}" data-w="${w}">${disp(w)}</button>`;
  html+='</div>';
  if(!g.done){
    const left=4-g.mistakes;
    html+=`<div class="dots">${t('left')}: ${[0,1,2,3].map(i=>`<i class="${i<left?'':'off'}"></i>`).join('')}</div>
    <div class="actions"><button class="btn" id="cShuf">${t('shuffle')}</button><button class="btn" id="cClr">${t('clear')}</button><button class="btn primary" id="cGo" ${g.sel.length!==4?'disabled':''}>${t('submit')}</button></div>`;
  }
  el.innerHTML=html;
  if(g.done) return renderResult();
  el.querySelectorAll('.word').forEach(b=>b.onclick=()=>{ const w=b.dataset.w; const k=g.sel.indexOf(w); if(k>=0) g.sel.splice(k,1); else if(g.sel.length<4) g.sel.push(w); save(); renderC(); });
  $('#cShuf').onclick=()=>{ g.order=shuffled(g.order, Date.now()&0xffff); save(); renderC(); };
  $('#cClr').onclick=()=>{ g.sel=[]; save(); renderC(); };
  $('#cGo').onclick=()=>{
    const keyS=g.sel.slice().sort().join('|');
    if(g.guesses.some(x=>x.slice().sort().join('|')===keyS)){ toast(t('tried')); return; }
    g.guesses.push(g.sel.slice());
    const hit=groups.findIndex(x=>g.sel.every(w=>x.w.includes(w)));
    if(hit>=0){ g.found.push(hit); g.sel=[]; FX.group=hit; if(g.found.length===4) finish('C',true); else save(); }
    else { const close=groups.some(x=>g.sel.filter(w=>x.w.includes(w)).length===3); g.mistakes++; toast(close?t('oneAway'):'✗'); TTLSound.play('nope');
      if(g.mistakes>=4) finish('C',false); else save(); }
    render();
  };
}

// ---------- RESULT + SHARE ----------
function scoreOf(m,g){ if(m==='A'||m==='U') return g.won? g.guesses.length : 7; if(m==='B') return g.rows.length+(g.hints||0); return g.won? g.mistakes : 5; }
function scoreTxt(m,s){ if((m==='A'||m==='U')&&s>6 || m==='C'&&s>4) return t('scX'); return tf(m==='C'?'scC':m==='B'?'scB':'scA',{k:num(s)}); }
function chalBanner(m){ const c=(S.ch||{})[m+'-'+day]; const g=S.games[key(m,day)]; if(!c||(g&&g.done)) return '';
  return `<div class="banner chal"><b>${esc(tf('chalBanner',{n:c.n,s:scoreTxt(m,c.s)}))}</b></div>`; }
function shareText(){
  const n=num(day+1), url=SITE_URL+'#'+(mode==='U'?'make':HASH[mode]);
  let body='';
  if(mode==='U'){ const p=giftPuzzle(), g=G('U'); const em={hit:'🟩',near:'🟨',miss:'⬜'};
    return `ပဟေဠိ ${tf('giftHead',{n:CUP.n})} ${g.won?num(g.guesses.length):'X'}/${num(6)}\n`+g.guesses.map(gs=>scoreRow(gs,p.s).map(r=>em[r]).join('')).join('\n')+`\n${url}`; }
  if(mode==='A'){ const p=pz('A',day), g=G('A'), ans=p.s;
    const em={hit:'🟩',near:'🟨',miss:'⬜'};
    body=`🔤 ${t('A')} ${g.won?num(g.guesses.length):'X'}/${num(6)}${g.hint?' 💡':''}\n`+g.guesses.map(gs=>scoreRow(gs,ans).map(r=>em[r]).join('')).join('\n');
  } else if(mode==='B'){ const g=G('B');
    body=`📜 ${t('B')} ✅ ${num(g.rows.length)} ${t('checks')}${g.hints?' '+'💡'.repeat(g.hints):''}\n`+g.rows.join('\n');
  } else { const raw=pz('C',day), g=G('C'); const col={1:'🟨',2:'🟩',3:'🟦',4:'🟪'};
    const gw=raw.map(([gi,...wi])=>({d:P.G[gi].d,w:wi.map(i=>P.G[gi].w[i])}));
    body=`🧩 ${t('C')} ${g.won?'✅':'✗'}\n`+g.guesses.map(gs=>gs.map(w=>col[gw.find(x=>x.w.includes(w)).d]).join('')).join('\n');
  }
  return `ပဟေဠိ #${n}\n${body}\n${url}`;
}
function nextBtn(){ const left=['A','B','C'].filter(m=>!(S.games[key(m,day)]||{}).done);
  return left.length? `<button class="btn gold" onclick="go('${left[0]}')">${t('nextGame')} ${t(left[0])}</button>` : `<p class="next"><b>${t('allDone')}</b></p>`; }
function renderResult(){
  const r=$('#result'); const g=G(); const txt=shareText();
  let head='';
  if(mode==='A'||mode==='U'){ const p= mode==='U'? giftPuzzle() : pz('A',day); head = g.won? t('won') : `${t('ansWas')} ${p.a}`; }
  else if(mode==='B') head=t('bWon'); else head = g.won? t('cWon'): t('cLost');
  const url=SITE_URL+'#'+(mode==='U'?'make':HASH[mode]);
  const c=(S.ch||{})[mode+'-'+day]; let vs='';
  if(c && mode!=='U'){ const me=scoreOf(mode,g); vs=`<p class="vs">${esc(tf(me<c.s?'chalWin':me===c.s?'chalTie':'chalLose',{n:c.n}))}<br><small>${t('yourName')==='Your name'?'You':'သင်'}: ${scoreTxt(mode,me)} · ${esc(c.n)}: ${scoreTxt(mode,c.s)}</small></p>`; }
  r.hidden=false;
  r.innerHTML=`<h2>${head}</h2>${vs}${mode!=='U'&&SB_ON?'<p class="daystats" id="dayStats"></p>':''}
   <textarea class="sharebox" id="shareTxt" rows="${txt.split('\n').length}" readonly>${txt}</textarea>
   <div class="actions"><button class="btn primary" id="rShare">${t('share')}</button><button class="btn" id="rCopy">${t('copy')}</button></div>
   <button class="btn" id="rImg">${t('img')}</button>
   <div class="links"><a href="https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}" target="_blank" rel="noopener" id="rFb">Facebook</a><a href="viber://forward?text=${encodeURIComponent(txt)}" id="rViber">Viber</a></div>
   ${mode==='U' ? `<button class="btn gold" onclick="go('MAKE')">${t('giftMake')}</button>` : `<div class="chalbox"><label for="chName">${t('yourName')}</label><div class="actions"><input id="chName" maxlength="${NAME_MAX}" placeholder="${t('namePh')}" value="${esc(S.name||'')}"><button class="btn primary" id="rChal">${t('chal')}</button></div></div>${nextBtn()}`}
   ${day===todayIdx?`<p class="next">${t('next')}: <span id="cd"></span></p>`:''}`;
  $('#rCopy').onclick=copy;
  $('#rFb').addEventListener('click',()=>{ copy(true); });
  $('#rImg').onclick=shareImage;
  if(mode!=='U'&&SB_ON) loadStats(mode, g);
  if($('#rChal')) $('#rChal').onclick=()=>{ const nm=$('#chName').value.trim().slice(0,NAME_MAX); if(!nm){ toast(t('needName')); $('#chName').focus(); return; }
    S.name=nm; save(); const link=SITE_URL+'?c='+enc({m:mode,d:day,n:nm,s:scoreOf(mode,g)})+'#'+HASH[mode];
    const msg=tf('chalMsg',{d:num(day+1),m:t(mode),s:scoreTxt(mode,scoreOf(mode,g))})+'\n'+link;
    shareOrCopy(msg, t('chalReady')); };
  $('#rShare').onclick=async()=>{ try{ if(navigator.share){ await navigator.share({text:txt}); return; } }catch(e){ if(e&&e.name==='AbortError') return; } copy(); };
  tick();
}
async function loadStats(m, g){
  const el=$('#dayStats'); if(!el) return; const d=day;
  try{ if(g.sending) await g.sending; const st=await rpc('day_stats',{p_day:d,p_mode:m}); if(!$('#dayStats')||mode!==m||day!==d) return;
    const pl=st.players||0; if(!pl){ el.remove(); return; }
    if(pl===1 && g.sent){ el.textContent=t('stFirst'); return; }
    const me=scoreOf(m,g); let worse=0; for(const [k,n] of Object.entries(st.dist||{})) if(+k>me) worse+=n;
    const others = g.sent ? pl-1 : pl;
    let h=esc(tf('stP',{p:num(pl),x:num(Math.round(100*(st.solved||0)/pl))}));
    if(st.avg!=null) h+=' · '+esc(tf('stAvg',{a:scoreTxt(m,st.avg)}));
    if(others>0 && worse>0) h+='<br><b>'+esc(tf('stBetter',{x:num(Math.round(100*worse/others))}))+'</b>';
    el.innerHTML=h;
  }catch(e){ const x=$('#dayStats'); if(x) x.remove(); } }
async function shareOrCopy(text, okMsg){
  try{ if(navigator.share){ await navigator.share({text}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  try{ await navigator.clipboard.writeText(text); toast(okMsg||t('copied')); }catch(e){ openModal(`<p>${t('copyFail')}</p><textarea class="sharebox" rows="5" readonly>${esc(text)}</textarea>`); } }
async function copy(quiet){ const txt=$('#shareTxt').value; try{ await navigator.clipboard.writeText(txt); if(quiet!==true) toast(t('copied')); }catch(e){ const ta=$('#shareTxt'); ta.focus(); ta.select(); if(quiet!==true) toast(t('copyFail')); } }
async function shareImage(){
  const W=1080,H=1080, cv=document.createElement('canvas'); cv.width=W; cv.height=H; const x=cv.getContext('2d');
  try{ await Promise.all(['700 120px Padauk','600 46px "Noto Sans Myanmar"','400 38px "Noto Sans Myanmar"'].map(f=>document.fonts.load(f,'ပဟေဠိ'))); }catch(e){}
  const BODY='"Noto Sans Myanmar","Pyidaungsu","Myanmar Text",sans-serif';
  const rr=(X,Y,w,h,r,fill)=>{ x.beginPath(); x.moveTo(X+r,Y); x.arcTo(X+w,Y,X+w,Y+h,r); x.arcTo(X+w,Y+h,X,Y+h,r); x.arcTo(X,Y+h,X,Y,r); x.arcTo(X,Y,X+w,Y,r); x.closePath(); x.fillStyle=fill; x.fill(); };
  x.fillStyle='#e9ecf1'; x.fillRect(0,0,W,H); rr(60,60,W-120,H-120,48,'#ffffff');
  x.textAlign='center'; x.fillStyle='#1f2937'; x.font='700 120px Padauk,'+BODY; x.fillText('ပဟေဠိ',W/2,250);
  const lines=shareText().split('\n'); x.fillStyle='#2563eb'; x.font='600 46px '+BODY;
  x.fillText(mode==='U'? tf('giftHead',{n:CUP.n}) : `${t(mode)} · #${num(day+1)}`, W/2, 340);
  const COL={'🟩':'#2f8f5b','🟨':'#d4a017','⬜':'#c3cad4','🟦':'#3b82f6','🟪':'#8b5cf6'};
  const rows=lines.slice(1,-1).map(l=>Array.from(l).filter(ch=>COL[ch])).filter(r=>r.length);
  const cols=Math.max(1,...rows.map(r=>r.length)), gap=14;
  const size=Math.min(110, Math.floor((W-300-gap*(cols-1))/cols), Math.floor((470-gap*(rows.length-1))/Math.max(1,rows.length)));
  const gw=cols*size+(cols-1)*gap, gx=(W-gw)/2, gh=rows.length*size+(rows.length-1)*gap, gy=390+Math.max(0,(470-gh)/2);
  rows.forEach((r,ri)=>r.forEach((ch,ci)=>rr(gx+ci*(size+gap), gy+ri*(size+gap), size, size, 14, COL[ch])));
  const g=G(); const m=mode; let sc= m==='U' ? (g.won? `${num(g.guesses.length)}/${num(6)}`:'X') : scoreTxt(m,scoreOf(m,g));
  const st=(S.stats[m]||{}).streak||0; x.fillStyle='#1f2937'; x.font='600 54px '+BODY;
  x.fillText(sc + (m!=='U'&&st>1&&day===todayIdx? `   🔥 ${num(st)}`:''), W/2, 920);
  x.fillStyle='#6b7280'; x.font='400 38px '+BODY; x.fillText('game.thinthilar.com', W/2, 985);
  const blob=await new Promise(res=>cv.toBlob(res,'image/png'));
  const file= blob && typeof File==='function' ? new File([blob],'pahaeli.png',{type:'image/png'}) : null;
  try{ if(file && navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], text: lines[lines.length-1]}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  const url=cv.toDataURL('image/png');
  openModal(`<img src="${url}" alt="ပဟေဠိ result" style="width:100%;border-radius:12px"><p>${t('imgSave')}</p><a class="btn" href="${url}" download="pahaeli.png" style="text-align:center;text-decoration:none;color:var(--ink);padding:10px">${t('dl')}</a>`);
}
function tick(){ const el=$('#cd'); if(!el) return; let ms=EPOCH+(todayIdx+1)*DAY-Date.now(); if(ms<0) ms=0;
  const h=Math.floor(ms/36e5), m=Math.floor(ms%36e5/6e4), s=Math.floor(ms%6e4/1e3); el.textContent=num(`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`); }
setInterval(tick,1000);

function renderMenu(){
  const ic={A:'🔤',B:'📜',C:'🧩'};
  $('#game').innerHTML=`<div class="menu"><h2>${t('pick')}</h2>${['A','B','C'].map(m=>{ const g=S.games[key(m,day)];
    return `<button class="card" onclick="go('${m}')"><span class="ic">${ic[m]}</span><span><b>${t(m)}</b><small>${t('d'+m)}</small></span><span class="pill ${g&&g.done?'ok':''}">${g&&g.done?t('done'):t('play')}</span></button>`; }).join('')}
    ${SB_ON?`<button class="card gift" onclick="go('F')"><span class="ic">👥</span><span><b>${t('frT')}</b><small>${t('frD')}</small></span><span class="pill">${(S.groups||[]).length?num(S.groups.length):t('play')}</span></button>`:''}
    <button class="card gift" onclick="go('MAKE')"><span class="ic">🎁</span><span><b>${t('mkT')}</b><small>${t('mkD')}</small></span><span class="pill">${t('play')}</span></button></div>`;
}
function renderMake(){
  const el=$('#game');
  el.innerHTML=`<div class="menu"><h2>${t('mkT')}</h2><p class="howto">${t('mkHow')}</p>
   <div class="form"><label for="mkWord">${t('mkWord')}</label><input id="mkWord" maxlength="20" placeholder="${t('mkWordPh')}" autocomplete="off">
   <label for="mkHint">${t('mkHint')}</label><input id="mkHint" maxlength="40" placeholder="${t('mkHintPh')}" autocomplete="off">
   <label for="mkName">${t('yourName')}</label><input id="mkName" maxlength="${NAME_MAX}" placeholder="${t('namePh')}" value="${esc(S.name||'')}">
   <p class="err" id="mkErr" role="alert"></p>
   <button class="btn primary" id="mkGo">${t('mkBtn')}</button></div><div id="mkOut"></div></div>`;
  ['mkWord','mkName'].forEach(id=>$('#'+id).oninput=()=>{$('#mkErr').textContent='';});
  $('#mkGo').onclick=()=>{
    const w=$('#mkWord').value.trim(), h=$('#mkHint').value.trim().slice(0,40), nm=$('#mkName').value.trim().slice(0,NAME_MAX);
    const sy=syl(w);
    if(sy.length!==2 || !sy.every(x=>/^[\u1000-\u109F]+$/.test(x))){ $('#mkErr').textContent=t('mkErr2'); $('#mkWord').focus(); return; }
    if(BLOCK.some(b=>w.includes(b)||h.includes(b)||nm.includes(b))){ $('#mkErr').textContent=t('mkBad'); return; }
    if(!nm){ $('#mkErr').textContent=t('needName'); $('#mkName').focus(); return; }
    S.name=nm; save();
    const link=SITE_URL+'?p='+enc({w:sy.join(''),h,n:nm})+'#gift'; const msg=tf('mkMsg',{n:nm})+'\n'+link;
    $('#mkOut').innerHTML=`<div class="result"><h2>${t('mkDone')}</h2><textarea class="sharebox" rows="3" readonly>${esc(msg)}</textarea>
      <div class="actions"><button class="btn primary" id="mkShare">${t('share')}</button><a class="btn" href="viber://forward?text=${encodeURIComponent(msg)}" style="text-align:center;text-decoration:none;color:var(--ink);padding:10px">Viber</a></div>
      <a class="btn" href="${esc(link)}" style="text-align:center;text-decoration:none;color:var(--ink);padding:10px">${t('mkTry')}</a></div>`;
    $('#mkShare').onclick=()=>shareOrCopy(msg);
  };
}
function weekRange(){ const from=todayIdx-((todayIdx+6)%7); return [from, from+6]; }
function renderFriends(){
  const el=$('#game'); S.groups=S.groups||[];
  const field=(id,lab,ph,val,max)=>`<label for="${id}">${lab}</label><input id="${id}" maxlength="${max}" placeholder="${ph}" value="${esc(val||'')}" autocomplete="off">`;
  el.innerHTML=`<div class="menu"><h2>${t('frT')}</h2><p class="howto">${t('frHow')}</p>
    ${JOIN?`<div class="banner chal"><b id="invTitle">${esc(tf('frInvited',{g:JOIN}))}</b></div>`:''}
    <div id="grpList">${S.groups.length?'':`<p class="howto">${t('frNone')}</p>`}</div>
    <div class="form box"><h3>${t('frJoin')}</h3>${field('jCode',t('frCode'),t('frCodePh'),JOIN||'',6)}${field('jName',t('yourName'),t('namePh'),S.name,NAME_MAX)}
      <p class="err" id="jErr" role="alert"></p><button class="btn primary" id="jGo">${t('frJoinBtn')}</button></div>
    <div class="form box"><h3>${t('frNew')}</h3>${field('cName',t('frName'),t('frNamePh'),'',40)}${field('cNick',t('yourName'),t('namePh'),S.name,NAME_MAX)}
      <p class="err" id="cErr" role="alert"></p><button class="btn" id="cGo2">${t('frCreate')}</button></div>
    <p class="next">${t('frPts')}</p></div>`;
  if(JOIN && SB_ON) rpc('group_name',{p_code:JOIN}).then(n=>{ const x=$('#invTitle'); if(x&&n) x.textContent=tf('frInvited',{g:n}); }).catch(()=>{});
  ['jCode','jName'].forEach(id=>$('#'+id).oninput=()=>{$('#jErr').textContent='';});
  ['cName','cNick'].forEach(id=>$('#'+id).oninput=()=>{$('#cErr').textContent='';});
  $('#jGo').onclick=async()=>{ const code=$('#jCode').value.trim().toUpperCase(), nm=$('#jName').value.trim();
    if(!code){ $('#jErr').textContent=t('errCode'); return; } if(!nm){ $('#jErr').textContent=t('needName'); return; }
    try{ const name=await rpc('join_group',{p_code:code,p_player:pid(),p_nick:nm}); S.name=nm;
      S.groups=S.groups.filter(x=>x.code!==code); S.groups.unshift({code,name}); JOIN=null; save(); toast(t('frJoined')); renderFriends(); }
    catch(e){ $('#jErr').textContent=errMsg(e); } };
  $('#cGo2').onclick=async()=>{ const gn=$('#cName').value.trim(), nm=$('#cNick').value.trim();
    if(!gn){ $('#cErr').textContent=t('errNeedGroup'); return; } if(!nm){ $('#cErr').textContent=t('needName'); return; }
    if(BLOCK.some(b=>gn.includes(b)||nm.includes(b))){ $('#cErr').textContent=t('mkBad'); return; }
    try{ const code=await rpc('create_group',{p_name:gn,p_player:pid(),p_nick:nm}); S.name=nm; S.groups.unshift({code,name:gn}); save(); toast(t('frCreated')); renderFriends(); }
    catch(e){ $('#cErr').textContent=errMsg(e); } };
  const [from,to]=weekRange(), list=$('#grpList');
  S.groups.forEach((gr,i)=>{ const box=document.createElement('div'); box.className='grp';
    box.innerHTML=`<div class="grphead"><span><b>${esc(gr.name)}</b><small>${t('frCode')}: ${esc(gr.code)} · ${t('frWeek')}</small></span>
      <button class="btn gold sm" data-inv="${i}">${t('frInvite')}</button></div><div class="board2" id="b-${esc(gr.code)}">…</div>
      <button class="linkbtn" data-leave="${i}">${t('frLeave')}</button>`;
    list.appendChild(box);
    rpc('group_board',{p_code:gr.code,p_from:from,p_to:to,p_player:pid()}).then(rows=>{
      const b=document.getElementById('b-'+gr.code); if(!b) return;
      if(!rows.length||rows.every(r=>!r.played)){ b.innerHTML=`<p class="howto">${t('frEmpty')}</p>`; }
      b.innerHTML=(b.innerHTML.startsWith('<p')?b.innerHTML:'')+`<table><thead><tr><th>#</th><th></th><th>${t('frCol')}</th><th>${t('frSolved')}</th></tr></thead><tbody>${rows.map((r,k)=>`<tr class="${r.is_me?'me':''}"><td>${num(k+1)}</td><td>${esc(r.nickname)}${r.is_me?' '+t('frMe'):''}</td><td>${num(r.points)}</td><td>${num(r.solved)}</td></tr>`).join('')}</tbody></table>`;
    }).catch(()=>{ const b=document.getElementById('b-'+gr.code); if(b) b.innerHTML=`<p class="err">${t('errNet')}</p>`; });
  });
  list.querySelectorAll('[data-inv]').forEach(b=>b.onclick=()=>{ const gr=S.groups[+b.dataset.inv]; shareOrCopy(tf('frInvMsg',{g:gr.name,c:gr.code})+'\n'+SITE_URL+'?g='+gr.code+'#friends'); });
  list.querySelectorAll('[data-leave]').forEach(b=>b.onclick=()=>{ const gr=S.groups[+b.dataset.leave]; rpc('leave_group',{p_code:gr.code,p_player:pid()}).catch(()=>{}); S.groups=S.groups.filter(x=>x!==gr); save(); renderFriends(); });
}
function confetti(){
  if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=document.createElement('canvas'); cv.className='fx'; const W=cv.width=innerWidth*devicePixelRatio, H=cv.height=innerHeight*devicePixelRatio; document.body.appendChild(cv);
  const x=cv.getContext('2d'), C=['#2563eb','#e3b54f','#2f8f5b','#d4a017','#8b5cf6','#ffffff'], d=devicePixelRatio;
  const ps=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*W*.3, y:H*.35, vx:(Math.random()-.5)*16*d, vy:(-Math.random()*15-6)*d, s:(Math.random()*7+5)*d, r:Math.random()*6, vr:(Math.random()-.5)*.3, c:C[Math.random()*C.length|0]}));
  const t0=performance.now();
  (function step(t){ const k=(t-t0)/1800; x.clearRect(0,0,W,H);
    for(const p of ps){ p.vy+=.5*d; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr; x.save(); x.globalAlpha=Math.max(0,1-k); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66); x.restore(); }
    if(k<1) requestAnimationFrame(step); else cv.remove(); })(t0);
}
function render(){ $('#result').hidden=true; if(mode==='U'&&!CUP) mode='MENU'; renderChrome(); ({MENU:renderMenu,A:renderA,B:renderB,C:renderC,U:renderA,MAKE:renderMake,F:renderFriends})[mode](); renderChrome();
  if(FX.win) setTimeout(confetti, mode==='A'||mode==='U'?650:150);
  if(FX.row>=0) TTLSound.play('flip');
  if(FX.locks.length) TTLSound.play('lock',FX.locks.length);
  if(FX.group>=0) TTLSound.play('match');
  if(FX.win) setTimeout(()=>TTLSound.play('win'), mode==='A'||mode==='U'?1150:(FX.group>=0?450:250));
  FX.row=-1; FX.locks=[]; FX.group=-1; FX.win=false; }
render();
TTLAccount.mount('#btnAcct',['pahaeli']);
TTLSound.bind($('#btnSnd'));
document.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b || b.disabled || /^(aGo|bGo|cGo|btnSnd)$/.test(b.id)) return;
  if(b.id==='aDel') return TTLSound.play('del');
  if(/Hint$/.test(b.id)) return TTLSound.play('hint');
  TTLSound.play(b.matches('.key,.piece,.word')?'tap':'click'); });
</script>
